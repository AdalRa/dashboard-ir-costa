function build(rows){

 const [iA,iF,iM,iS,iC,iV,iI]=need.map(ix);
 const tc=s=>s.trim().toLowerCase().replace(/(^|[^\p{L}])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
 const data=[];
 for(let k=1;k<rows.length;k++){const r=rows[k],f=(r[iF]||"").trim().slice(0,10),a=tc(r[iA]||"");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f)||!a)continue;

let t=`<tr><th>#</th><th>Asesor</th><th class="r">Unidades</th><th style="width:140px">% del mes</th><th class="r">Mes anterior</th><th class="r">Promedio/día</th><th class="r">Proyección <span class="d">(target 90)</span></th></tr>`;
ids.forEach((i,k)=>{
 const rs=D.rec.filter(r=>r[1]==i);
 const pj=Math.round(cur[i]/dayN*monDays),pp=Math.round(pj/TG*100);
 t+=`<tr class="row" data-i="${i}"><td class="mu">${k+1}</td><td><b>${D.ad[i]}</b></td><td class="r"><b>${cur[i]}</b></td><td><div class="bar"><i style="width:${cur[i]/cur[ids[0]]*100}%"></i></div><span class="d">${(cur[i]/curT*100).toFixed(1)}%</span></td><td class="r">${D.mat[i][pi]}</td><td class="r">${(cur[i]/dayN).toFixed(1)}</td><td class="r"><b>${pj}</b> <span class="${pp>=100?'up':'dn'}">${pp}%</span></td></tr><tr class="det" id="d${i}" hidden><td colspan="7"><div class="in"><table><tr><th>Fecha</th><th>Modelo</th><th>Tienda</th><th>Ciudad</th></tr>${rs.map(r=>`<tr><td>${String(r[0]).padStart(2,"0")}/${String(cm).padStart(2,"0")}</td><td>${sn(r[2])}</td><td>${D.sts[r[3]]}</td><td>${D.cts[r[4]]}</td></tr>`).join("")}</table></div></td></tr>`;
});
t+=`<tr><td></td><td><b>Total</b></td><td class="r"><b>${curT}</b></td><td></td><td class="r"><b>${prevT}</b></td><td class="r"><b>${pace.toFixed(1)}</b></td><td class="r"><b>${Math.round(pace*monDays)}</b></td></tr>`;
$("tb").innerHTML=t;
// imeis sin activar
const INA=D.ina.filter(r=>r[1].startsWith(D.months[ci]));
const ia={};INA.forEach(r=>(ia[r[0]]=ia[r[0]]||[]).push(r));
const io=Object.keys(ia).map(Number).sort((a,b)=>ia[b].length-ia[a].length);
const fd=s=>s.split("-").reverse().join("/");
$("ni").textContent=INA.length+" sin activar";
$("ti").innerHTML=`<tr><th>Asesor</th><th class="r">IMEIs sin activar</th></tr>`+io.map(i=>`<tr class="row" data-j="${i}"><td><b>${D.ad[i]}</b></td><td class="r"><b>${ia[i].length}</b></td></tr><tr class="det" id="j${i}" hidden><td colspan="2"><div class="in"><table><tr><th>IMEI</th><th>Fecha de carga</th><th>Tienda</th></tr>${ia[i].sort((a,b)=>b[1].localeCompare(a[1])).map(r=>`<tr><td>${r[2]}</td><td>${fd(r[1])}</td><td>${D.ist[r[3]]}</td></tr>`).join("")}</table></div></td></tr>`).join("");
document.querySelectorAll("tr.row").forEach(r=>r.onclick=()=>{const e=$(r.dataset.j?"j"+r.dataset.j:"d"+r.dataset.i);e.hidden=!e.hidden});
// tema

// ---- captura y búsqueda de IMEI ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function srch(){
 const q=$("qi").value.replace(/\D/g,""),o=$("qr");
 if(!D.im){o.innerHTML='<div class="d">No hay IMEIs en el archivo.</div>';return}
 if(q.length!==15){o.innerHTML='<div class="d">Escribe los 15 dígitos del IMEI'+(q.length?' ('+q.length+'/15)':'')+'.</div>';return}
 const hits=D.im.filter(r=>r[0]===q);
 if(!hits.length){o.innerHTML='<div class="d">No se encontró ningún IMEI con ese número.</div>';return}
 o.innerHTML=(hits.length>20?`<div class="d" style="margin-bottom:8px">Mostrando 20 de ${hits.length} coincidencias</div>`:"")+`<div class="sc"><table style="min-width:560px"><tr><th>IMEI</th><th>Cargado por</th><th>Fecha de carga</th><th>Tienda</th><th>Estado</th></tr>${hits.slice(0,20).map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(D.ad[r[1]])}</b></td><td>${fd(r[2])}</td><td>${esc(D.ast[r[3]])}</td><td>${r[4]?"Activado "+fd(r[4]):"Sin activar"}</td></tr>`).join("")}</table></div>`}
$("qi").oninput=srch;srch();
$("cb").onclick=async()=>{
 const b=$("cb"),t0=b.textContent,say=m=>{b.textContent=m;setTimeout(()=>b.textContent=t0,3500)};
 b.disabled=true;b.textContent="Generando…";
 let w;
 try{
  if(typeof html2canvas==="undefined")throw new Error("No se pudo cargar la herramienta de captura");
  const src=$("cardv"),c=src.cloneNode(true);
  c.removeAttribute("id");c.querySelector("#cb").remove();
  c.style.cssText="margin:0;width:940px";
  c.querySelector(".sc").style.overflow="visible";
  c.querySelector("table").style.minWidth="0";
  const f=document.createElement("div");f.className="d";f.style.marginTop="10px";f.textContent="Dashboard IR COSTA · datos al "+fd(D.last);c.appendChild(f);
  w=document.createElement("div");
  w.style.cssText="position:fixed;left:-12000px;top:0;padding:16px;background:var(--bg);width:972px";
  w.appendChild(c);document.body.appendChild(w);
  const cv=await html2canvas(w,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,logging:false,scrollX:0,scrollY:0,windowWidth:1100});
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(!blob)throw new Error("No se pudo generar la imagen");
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="ventas-mes-actual-"+D.last+".png";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  b.textContent=t0;
 }catch(e){say((e&&e.message)||"No se pudo generar la captura")}
 finally{if(w)w.remove();b.disabled=false}};
let dk=matchMedia("(prefers-color-scheme: dark)").matches;
$("th").onclick=()=>{dk=!dk;document.documentElement.dataset.theme=dk?"dark":"light"};

}

(async()=>{const st=$("st");let D,fuente="";
 try{
  st.textContent="Cargando datos…";
  const r=await fetch("datos.csv?v="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("sin datos.csv");

 }catch(e){
  try{D=JSON.parse($("dj").textContent);fuente=""}
  catch(e2){st.textContent="No se pudieron cargar los datos.";return}
 }
 st.textContent=fuente;
 main(D);
})();
